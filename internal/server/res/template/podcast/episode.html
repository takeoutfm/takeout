<div>
  <h1>{{ .Episode.Title }}</h1>
</div>
<div>
  <img height="144" src="{{.Episode|image}}">
</div>
<div>
  {{ .Episode.Date | ymd }}
</div>
<div style="white-space: pre-line;">{{ .Episode.Description | plainText }}</div>
<div>
  <audio controls="">
    <source src="{{.Episode|url}}" type="{{ .Episode.ContentType }}">
  </audio>
</div>
