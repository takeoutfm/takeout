<div>
  <div class="page-head">
    <img class="cover" src="{{.Series|image}}" alt="">
    <div>
      <h1>{{ .Series.Title }}</h1>
      {{ if .Series.Author }}<div class="subtitle">{{ .Series.Author }}</div>{{ end }}
      <div class="muted">{{ len .Episodes }} episodes</div>
    </div>
  </div>
  <div class="actions">
    <a class="button" href="#" data-playlist="add-ref" data-ref="/podcasts/series/{{.Series.ID}}">
      <img src="/static/play_arrow-white-24dp.svg" alt="">Play latest
    </a>
  </div>
  {{ if .Series.Description }}<p class="description">{{ .Series.Description | plainText }}</p>{{ end }}
  <div class="section-head"><h2>Episodes</h2></div>
  <ol class="tracks">
    {{ range .Episodes }}{{ template "episode-row" . }}{{ end }}
  </ol>
</div>
