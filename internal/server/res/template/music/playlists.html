<div>
  <h1>Playlists</h1>
  <ol class="tracks">
    {{ range .Playlists }}
    <li class="track" data-playlist="add-ref" data-ref="{{.|ref}}">
      <div class="text">
	<div class="title">{{ .Name }}</div>
	{{ if .TrackCount }}<div class="sub">{{ .TrackCount }} tracks</div>{{ end }}
      </div>
      <a class="add" href="#" data-playlist="append-ref" data-ref="{{.|ref}}" title="Add to queue">
	<img src="/static/playlist_add-white-24dp.svg" alt="Add to queue">
      </a>
    </li>
    {{ else }}
    <p class="empty">No playlists yet. Make them in the TakeoutFM app.</p>
    {{ end }}
  </ol>
</div>
