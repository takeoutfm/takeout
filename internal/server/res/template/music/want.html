<div>
  <h1>{{ .Artist.Name }}</h1>
  <div>
    <h2>Want Releases</h2>
    {{ range .Releases }}
    <div class="tile-110 float-left">
      <a class="nodecor" target="_blank" href="{{.|link_amz}}">
	<img class="rounded" width="110" height="110" src="{{.|cover}}">
	<br/>
	<div class="release-small-title">{{ .Name }}</div>
	<div class="release-small-year">{{ .Date.Year }}</div>
      </a>
    </div>
    {{ end }}
  </div>
  <div class="clear"></div>
  <h3>External Links</h3>
  MusicBrainz:
  <a target="_blank" href="{{.Artist|link_mbz}}">{{.Artist.Name}}</a>
</div>
