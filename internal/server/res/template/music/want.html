<div>
  <h1>{{ .Artist.Name }}: Want List</h1>
  <p class="muted">Releases not in the library. Each opens on Amazon.</p>
  <div class="tiles">
    {{ range .Releases }}
    <a class="tile" target="_blank" rel="noopener" href="{{.|link_amz}}">
      <img src="{{.|cover}}" alt="" loading="lazy">
      <div class="tile-title">{{ .Name }}</div>
      <div class="tile-sub">{{ .Date.Year }}</div>
    </a>
    {{ else }}
    <p class="empty">Nothing missing.</p>
    {{ end }}
  </div>
  <div class="links">
    <a target="_blank" rel="noopener" href="{{.Artist|link_mbz}}">{{ .Artist.Name }} on MusicBrainz</a>
  </div>
</div>
