<div>
  <h1>Radio</h1>
  {{ if .Live }}
  <div class="section-head"><h2>Live</h2></div>
  <div class="tiles">{{ range .Live }}{{ template "station-tile" . }}{{ end }}</div>
  {{ end }}
  {{ if .Stream }}
  <div class="section-head"><h2>Streams</h2></div>
  <div class="tiles">{{ range .Stream }}{{ template "station-tile" . }}{{ end }}</div>
  {{ end }}
</div>
