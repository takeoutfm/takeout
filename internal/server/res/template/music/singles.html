<div>
  <h1>{{ .Artist.Name }}: Singles</h1>
  <div class="actions">
    <a class="button" href="#" data-playlist="add-ref" data-ref='{{ref .Artist "singles"}}'>
      <img src="/static/play_arrow-white-24dp.svg" alt="">Play
    </a>
    <a class="button" href="#" data-playlist="add-ref" data-shuffle data-ref='{{ref .Artist "singles"}}'>
      <img src="/static/shuffle-white-24dp.svg" alt="">Shuffle
    </a>
    <a class="button" href="{{.Artist|link}}">{{ .Artist.Name }}</a>
  </div>
  <ol class="tracks" data-list-ref='{{ref .Artist "singles"}}'>
    {{ range .Singles }}{{ template "track" . }}{{ end }}
  </ol>
</div>
