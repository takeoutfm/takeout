<!DOCTYPE html>
<html>
  <head>
    <title>TakeoutFM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="{{asset "takeout.css"}}">
    <link rel="stylesheet" type="text/css" href="{{asset "music.css"}}">
    <link rel="stylesheet" type="text/css" href="{{asset "movie.css"}}">
    <link rel="stylesheet" type="text/css" href="{{asset "tv.css"}}">
    <link rel="stylesheet" type="text/css" href="{{asset "podcast.css"}}">
    <link rel="icon" type="image/svg+xml" href="{{asset "favicon.svg"}}">
    <script type="text/javascript" src="{{asset "music.js"}}"></script>
    <script type="text/javascript" src="{{asset "chart.umd.js"}}"></script>
  </head>
  <body>
    <div id="top">
      <div class="parent4">
	<div>
	  <a data-link="{{home}}" class="takeout">Home</a>
	  {{ if .HasMusic }}
	  <a data-link="/v?artists=x" class="takeout">Artists</a>
	  <a data-link="/v?radio=x" class="takeout">Radio</a>
	  {{ if .HasPlaylists }}
	  <a data-link="/v?playlists=x" class="takeout">Playlists</a>
	  {{ end }}
	  {{ end }}
	  {{ if .HasMovies }}
	  <a data-link="/v?movies=x" class="takeout">Movies</a>
	  {{ end }}
	  {{ if .HasShows }}
	  <a data-link="/v?tv=x" class="takeout">TV Shows</a>
	  {{ end }}
	  {{ if .HasPodcasts }}
	  <a data-link="/v?podcasts=x" class="takeout">Podcasts</a>
	  {{ end }}
	  <a data-link="/v?activity=recent" class="takeout">Activity</a>
	</div>
	<div class="parent">
	  <div>
	    <img class="np-control" data-action="toggle" src="/static/list-white-36dp.svg">
	  </div>
	</div>
      </div>
      <div style="display: flex; justify-content: center;">
	<div>
	  <form id="f">
	    <input class="search" id="q" type="text" placeholder="Search: text, artist:name, guitar:person, etc.">
	  </form>
	</div>
      </div>
      <div id="main">
	Loading...
      </div>
      <div id="playlist" style="display: none;">
      </div>
      <p style="clear: both;"/>
      <div id="playing" style="display: none;">
	<audio id="audio">
	  <source id="audio-source" src=""></source>
	</audio>
	<div class="footer" style="display: block;">
	  <table class="full-width playing">
	    <tr class="playing">
	      <td class="np-cover" data-action="toggle">
		<img class="mini-cover" name="np-cover"/>
	      </td>
	      <td class="playing">
		<div class="np-track" data-action="toggle">
		  <div class="np-title" name="np-title"></div>
		  <div class="np-artist" name="np-artist"></div>
		  <div class="np-duration" id="np-duration"></div>
		</div>
	      </td>
	      <td class="np-control playing">
		<img id="np-playpause" class="np-control playing" src="">
	      </td>
	      <td class="np-control playing">
		<img id="np-next" class="np-control playing" src="">
	      </td>
	    </tr>
	  </table>
	  <div style="padding: 2px;">
	    <div id="progressbar">
	      <div id="progress"></div>
	    </div>
	  </div>
	</div>
      </div>
  </body>
</html>
