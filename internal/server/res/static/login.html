<!DOCTYPE html>
<html>
  <head>
    <title>TakeoutFM Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/login.css">
  </head>
  <body>
    <form method="post" action="/login">
      <div class="container">
	<div class="box">
	  <h2>TakeoutFM Login</h2>
	</div>
	<div class="box">
	  <input type="text" name="user" placeholder="Username..." size="16" required>
	</div>
	<div class="box">
	  <input type="password" name="pass" placeholder="Password..." size="16" required>
	</div>
	<div class="box">
	  <input type="text" name="passcode" placeholder="Passcode..." size="6">
	</div>
	<div class="box">
	  <button type="submit">Login</button>
	</div>
      </div>
    </form>
    <div class="footer">
      <div>
	<a href="https://github.com/takeoutfm">@defsub</a>
	&#x2022
	<a href="https://github.com/takeoutfm/takeout/blob/master/doc/privacy.md">Privacy</a>
	&#x2022
	<a href="https://github.com/takeoutfm/takeout/blob/master/doc/contribute.md">Contribute</a>
      </div>
    </div>
  </body>
</html>
