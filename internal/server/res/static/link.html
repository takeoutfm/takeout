<!DOCTYPE html>
<html>
  <head>
    <title>TakeoutFM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/login.css">
  </head>
  <body>
    <form method="post" action="/link">
      <div class="container">
	<div class="box">
	  <h2>TakeoutFM Link Account</h2>
	</div>
	<div class="box">
	  <input type="text" name="user" placeholder="Username..." size="32" required>
	</div>
	<div class="box">
	  <input type="password" name="pass" placeholder="Password..." size="32" required>
	</div>
	<div class="box">
	  <input type="text" name="passcode" placeholder="Passcode..." size="6">
	</div>
	<div class="box">
	  <input type="text" name="code" placeholder="Enter Code..." size="6" required>
	</div>
	<div class="box">
	  <button type="submit">Link</button>
	</div>
      </div>
    </form>
  </body>
</html>
